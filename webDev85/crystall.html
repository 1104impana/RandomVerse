<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  
  <title>Magic Ball Fortune Teller</title>
  <link rel="stylesheet" href="css/crystall.css">
  <style>
    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
      margin-top: 50px;
      flex-wrap: wrap;
    }

    .left-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
       margin-top: -170px;
      margin-left: 200px;
     
    
    
    }

    .left-section input {
      padding: 10px;
      width: 250px;
      border-radius: 8px;
      border: none;
    }

    .left-section button {
      padding: 10px 20px;
      background-color: transparent;
      color: white;
      border-color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      
    }

    .right-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
  
    }

    .right-section img {
      max-width: 280px;
      cursor: pointer;
    }
    h1{
      font-size:50px;
    }
  </style>

</head>

<body>
  <nav class="navbar">
  <div class="nav-left">
    <a href="Homepage.html">
      <img src="images/witch.png" alt="icon" class="responsive-img">
    </a>
  </div>

  <div class="nav-right">
    <div class="nav-item">
      <a href="ripple.html">
        <img src="images/galaxy.png" alt="Paint" class="nav-icon">
      </a>
    </div>

    <div class="nav-item">
      <a href="crystall.html">
        <img src="images/crystal-ball.png" alt="Crystal" class="nav-icon">
      </a>
      
    </div>

    <div class="nav-item">
      <a href="fortune.html">
        <img src="images/fornav.png" alt="Fortune" class="nav-icon">
      </a>
    </div>

    <div class="nav-item">
      <a href="meditation.html">
        <img src="images/relaxed.png" alt="Meditation" class="nav-icon">
      </a>
    </div>
  </div>
</nav>




  <div class="container">
    <audio id="laughSound">
      <source src="images/laugh.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="text-container">
    <h1>Welcome to the crystal ball.</h1>
    <h2> Try not to be disappointed.</h2>
  </div>

  <div class="main-container">
    <div class="left-section">
      <input type="text" id="userQuestion" placeholder="eg: will I get a job?">
      <button onclick="askCrystalBall()">Ask the Witch</button>
    </div>
    <div class="right-container">
      <div class="crystal-container">

        <div class="ball-wrapper">
          <img id="magicBall" src="images/ball.png" alt="Magic Ball" style="width: 600px;;"
            onclick="askCrystalBall()">
          <div id="ballMessage">Ask your question!</div>
        </div>
      </div>
    </div>
  </div>

  </div>
  <script src="js/crystall.js"></script>
  <script>
    window.onload = function () {
      var audio = document.getElementById("laughSound");
      audio.play();
    };

  </script>
</body>

</html>
