<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Magic Ball Fortune Teller</title>
  <link rel="stylesheet" href="css/crystall.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .fullscreen-img {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      color: white;
      padding: 20px;
    }

    input[type="text"] {
      padding: 8px;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
      width: 250px;
    }

    button {
      padding: 8px 16px;
      margin-left: 10px;
      border-radius: 5px;
      border: none;
      background-color: #6200ea;
      color: white;
      cursor: pointer;
    }

    a {
      color: #ff4081;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    #ballMessage {
      font-style: italic;
      margin: 20px 0;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <!-- Background image -->
  <img src="images/lady2.jpg" alt="Magic Ball Background" class="fullscreen-img">

  <!-- Content container -->
  <div class="container">
    <audio id="laughSound">
      <source src="images/laugh.mp3" type="audio/mpeg">
    </audio>

    <h1>Welcome to the crystal ball. Try not to be disappointed.</h1>
    <h3>Type your question — because the ball loves ruining your day</h3>

    <div class="crystal-container">
      <div class="ball-wrapper">
        <div id="ballMessage">Ask your question!</div>
      </div>

      <input type="text" id="userQuestion" placeholder="eg: will I get a job?">
      <button onclick="askCrystalBall()">Ask the Ball</button>

      <h2>wanna check your fortune?</h2>
      <a href="fortune.html">click here :)</a>
    </div>
  </div>

  <script src="js/crystall.js"></script>
  <script>
    window.onload = function() {
      var audio = document.getElementById("laughSound");
      audio.play();
    };
  </script>
</body>
</html>
