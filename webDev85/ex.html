<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GSAP Cookie Tearing Effect</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<style>
  body {
    background: #222;
    color: #eee;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
  }
  #cookieBox {
    cursor: pointer;
    display: inline-block;
    position: relative;
  }
  #cookieImage {
    width: 200px;
    border-radius: 20px;
    user-select: none;
  }
  #fortuneMessage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    color: #333;
    padding: 15px 20px;
    border-radius: 10px;
    display: none;
    width: 180px;
    opacity: 0;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>Click the Cookie to Crack Your Fortune (GSAP)</h1>

<div id="cookieBox">
  <img id="cookieImage" src="../images/cook4.png" alt="Whole Cookie" />
  <div id="fortuneMessage"></div>
</div>

<script>
  const cookieBox = document.getElementById('cookieBox');
  const cookieImg = document.getElementById('cookieImage');
  const messageBox = document.getElementById('fortuneMessage');

  const breakImages = [
    "../images/break1.png",
    "../images/break2.png",
    "../images/break3.png",
    "../images/break4.png"
  ];

  const wholeCookie = "../images/cook4.png";

  // Preload images
  [wholeCookie, ...breakImages].forEach(src => {
    const img = new Image();
    img.src = src;
  });

  let isBroken = false;
  let tl;

  cookieBox.addEventListener('click', () => {
    if (isBroken) {
      if (tl) tl.kill();

      gsap.to(messageBox, {
        duration: 0.3,
        opacity: 0,
        onComplete: () => {
          messageBox.style.display = 'none';
          messageBox.textContent = '';
        }
      });

      gsap.to(cookieImg, {
        duration: 0.3,
        opacity: 0,
        rotation: 0,
        onComplete: () => {
          cookieImg.src = wholeCookie;
          gsap.to(cookieImg, { duration: 0.3, opacity: 1 });
        }
      });

      isBroken = false;
      return;
    }

    messageBox.style.display = 'none';
    messageBox.style.opacity = 0;
    messageBox.textContent = '';

    tl = gsap.timeline();

    breakImages.forEach((imgSrc, i) => {
      // Set the new image instantly
      tl.set(cookieImg, { attr: { src: imgSrc } });

      // Shake effect
      tl.to(cookieImg, {
        duration: 0.3,
        rotation: 0,
        onStart: () => {
          gsap.fromTo(cookieImg,
            { rotation: -5 },
            { rotation: 5, duration: 0.15, yoyo: true, repeat: 1, ease: "power1.inOut" }
          );
        }
      });

      if (i !== breakImages.length - 1) {
        tl.to({}, { duration: 0.3 });
      }
    });

    // Pause before showing message
    tl.to({}, { duration: 0.5 });

    tl.to(messageBox, {
      duration: 0.5,
      opacity: 1,
      onStart: () => {
        messageBox.style.display = 'block';
        messageBox.textContent = "Your fortune message here! 🍪";
      }
    });

    isBroken = true;
  });
</script>

</body>
</html>
