<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cookie Fortune Break</title>
  <link rel="stylesheet" href="css/fortune.css" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="Homepage.html">
        <img src="images/witch.png" alt="icon" class="responsive-img" />
      </a>
    </div>
    <div class="nav-right">
      <a href="ripple.html">
        <img src="images/galaxy.png" alt="Paint" class="nav-icon" />
      </a>
      <a href="crystall.html">
        <img src="images/crystal-ball.png" alt="Crystal" class="nav-icon" />
      </a>
      <a href="fortune.html">
        <img src="images/fornav.png" alt="Fortune" class="nav-icon" />
      </a>
      <a href="meditation.html">
        <img src="images/relaxed.png" alt="Meditation" class="nav-icon" />
      </a>
    </div>
  </nav>

  <div class="float-container">
    <!-- Floating cookies with random positions assigned by CSS variables -->
    <img src="images/cook1.png" class="cookie" style="--random-x:0.1; --random-y:0.9" />
    <img src="images/cook1.png" class="cookie" style="--random-x:0.3; --random-y:0.8" />
    <img src="images/cook1.png" class="cookie" style="--random-x:0.5; --random-y:0.7" />
    <img src="images/cook1.png" class="cookie" style="--random-x:0.7; --random-y:0.85" />
    <img src="images/cook1.png" class="cookie" style="--random-x:0.9; --random-y:0.75" />
    <img src="images/cook1.png" class="cookie" style="--random-x:0.2; --random-y:0.6" />
    <img src="images/cook1.png" class="cookie" style="--random-x:0.4; --random-y:0.5" />
    <img src="images/cook1.png" class="cookie" style="--random-x:0.6; --random-y:0.65" />
    <img src="images/cook1.png" class="cookie" style="--random-x:0.8; --random-y:0.55" />
  </div>

  <div class="container">
    <h1>CRACK YOUR FORTUNE</h1>
  </div>

  <div class="cookie-container" id="cookieBox" onclick="breakCookie()">
    <img src="images/cook4.png" id="cookieImage" class="cookie-img" alt="Fortune Cookie" />
    <div class="message-box" id="fortuneMessage"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/fortune.js"></script>
</body>
</html>
