  <div class="content-wrapper">
    <div class="container">
      <h1>CRACK YOUR FORTUNE</h1>
    </div>

    <div class="cookie-container" id="cookieBox" onclick="breakCookie('')">
      <img src="images/cook4.png" id="cookieImage" class="cookie-img" alt="Fortune Cookie" style="width: 280px;"/>
      <div class="message-box" id="fortuneMessage"></div>
    </div>

    <div class="cookie-container corner-cookie" onclick="breakCookie('Corner1')">
      <img src="images/cook4.png" id="cookieImageCorner1" class="cookie-img" style="width: 160px;" alt="Fortune Cookie" />
      <div class="message-box" id="fortuneMessageCorner1"></div>
    </div>

    <div class="cookie-container right-corner-cookie" onclick="breakCookie('Corner2')">
      <img src="images/cook4.png" id="cookieImageCorner2" class="cookie-img" style="width: 180px;" alt="Fortune Cookie" />
      <div class="message-box" id="fortuneMessageCorner2"></div>
    </div>

    <div class="cookie-container between-corner-cookie" onclick="breakCookie('Corner3')">
      <img src="images/cook4.png" id="cookieImageCorner3" class="cookie-img"style="width: 100px;" alt="Fortune Cookie" />
      <div class="message-box" id="fortuneMessageCorner3"></div>
    </div>

    <div class="cookie-container place-corner-cookie" onclick="breakCookie('Corner4')">
      <img src="images/cook4.png" id="cookieImageCorner4" class="cookie-img" style="width: 170px;" alt="Fortune Cookie" />
      <div class="message-box" id="fortuneMessageCorner4"></div>
    </div>
  </div>
