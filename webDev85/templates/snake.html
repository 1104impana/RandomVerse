    <h1>SNAKE GAME</h1>
    <div class="score">Score: <span id="score">0</span></div>
    <canvas class="game-board" id="game"></canvas>

    <div class="controls">
        <p>Use ARROW KEYS to move</p>
        <p>Press SPACE to start/restart</p>
    </div>
    <div class="game-over" id="gameOver">
        <p>Game Over!</p>
        <p>Final Score: <span id="finalScore">0</span></p>
    </div>
    <button id="startBtn" onclick="startGame()">START GAME</button>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');

        function resizeCanvas() {
    const board = document.querySelector('.game-board');
    const size = board.offsetWidth;
    canvas.width = size;
    canvas.height = size;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas(); // Initial call


        // Game variables
        const gridSize = 20;
        let snake = [{x: 200, y: 200}];
        let food = {x: 0, y: 0};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameRunning = false;
        let gameInterval;

        // Generate random food position
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize,
                y: Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize
            };
            
            // Make sure food doesn't spawn on snake
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }

        // Draw everything
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            ctx.fillStyle = '#fff';
            for (let segment of snake) {
                ctx.fillRect(segment.x, segment.y, gridSize - 2, gridSize - 2);
            }

            // Draw food
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);
        }

        // Move snake
        function move() {
            // Only move if there's a direction set
            if (dx === 0 && dy === 0) return;
            
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Check wall collision
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver();
                return;
            }

            // Check self collision
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
            startBtn.textContent = 'RESTART GAME';
            startBtn.style.display = 'block';
        }

        // Start game
        function startGame() {
               resizeCanvas();
            // Reset game state
            snake = [{x: 200, y: 200}];
            dx = gridSize; // Start moving right
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameOverElement.style.display = 'none';
            startBtn.style.display = 'none';
            
            generateFood();
            gameRunning = true;
            
            // Start game loop
            gameInterval = setInterval(() => {
                move();
                draw();
            }, 100);
            
            draw();
        }

        // Handle keyboard input
        document.addEventListener('keydown', function(e) {
            const key = e.key;
            
            // Prevent default scrolling for game keys
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) {
                e.preventDefault();
            }
            
            // Start/restart game with spacebar
            if (key === ' ') {
                if (!gameRunning) {
                    startGame();
                }
                return;
            }
            
            if (!gameRunning) return;
            
            // Change direction (prevent reversing)
            if (key === 'ArrowLeft' && dx !== gridSize) {
                dx = -gridSize;
                dy = 0;
            }
            if (key === 'ArrowUp' && dy !== gridSize) {
                dx = 0;
                dy = -gridSize;
            }
            if (key === 'ArrowRight' && dx !== -gridSize) {
                dx = gridSize;
                dy = 0;
            }
            if (key === 'ArrowDown' && dy !== -gridSize) {
                dx = 0;
                dy = gridSize;
            }
        });

        // Initial draw
        draw();
    </script>
