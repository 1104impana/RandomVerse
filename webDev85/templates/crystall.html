<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Ball Fortune Teller</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/crystall.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <style>
    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
      margin-top: 50px;
      flex-wrap: wrap;
    }

    .left-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: -170px;
      margin-left: 200px;
    }
    


    .left-section input {
      padding: 10px;
      width: 250px;
      border-radius: 8px;
      border: none;
    }

    .left-section button {
      padding: 10px 20px;
      background-color: transparent;
      color: white;
      border-color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .right-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .right-section img {
      max-width: 280px;
      cursor: pointer;
    }
    h1 {
  font-size: clamp(2.2rem, 4.5vw, 3.2rem); /* smaller + responsive */
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0.02em;
  text-align: center;
  max-width: 520px;
}

    .text-container {
      position: absolute;
      top: 35%;
      left: 8%;
      transform: translateY(-50%);
}
   
  </style>
</head>

<body>
    <div class="hint-box">
    Ask your question 🔮<br>
    Not all answers bring comfort
  </div>
  <nav class="navbar">
    <div class="nav-left">
      <div class="nav-item">
        <a href="{{ url_for('home') }}">
          <img src="{{ url_for('static', filename='images/witch.png') }}" alt="icon" class="responsive-img" />
        </a>
        <span class="tooltip-text">Home</span>
      </div>
    </div>
    
  </nav>

  <div class="container">
    <audio id="laughSound">
      <source src="{{ url_for('static', filename='images/laugh.mp3') }}" type="audio/mpeg">
    </audio>
  </div>

  <div class="text-container">
    <h1>THE VEIL IS THIN <br>TONIGHT</h1>
    
  </div>

  <div class="main-container">
    <div class="left-section">
      <input type="text" id="userQuestion" placeholder="eg: will I get a job?">
      <button onclick="askCrystalBall()">Ask the Witch</button>
    </div>
    <div class="right-container">
      <div class="crystal-container">
        <div class="ball-wrapper">
          <img id="magicBall" src="{{ url_for('static', filename='images/ball.png') }}" alt="Magic Ball" style="width: 600px;" onclick="askCrystalBall()">
          <div id="ballMessage">Ask your question!</div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/crystall.js') }}"></script>
  <script>
    window.onload = function () {
      var audio = document.getElementById("laughSound");
      audio.play();
    };

  
  const pages = ["/ripple", "/fortune", "/meditation"]; // Exclude /crystall since you're already on it

  function goToNextVerse() {
    const currentPath = window.location.pathname;
    const otherPages = pages.filter(path => currentPath !== path);
    const nextPage = otherPages[Math.floor(Math.random() * otherPages.length)];

    const overlay = document.getElementById("transition-overlay");
    overlay.style.pointerEvents = "auto";
    overlay.style.opacity = "1";

   setTimeout(() => {
  window.location.replace(nextPage);  // ✅ replaces current entry instead of adding a new one
}, 1000);
  }

 
  </script>


<a href="{{ url_for('next_verse', current=current_file, r=random()) }}"
   class="hero-btn next-verse-btn">
  >>Next Verse
</a>


<!-- Transition Overlay -->
<div id="transition-overlay">
  <div id="typewriter-text"></div>
</div>

</body>

</html>
