<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Ghost</title>

<style>

/* ===== GLOBAL ===== */
html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: Arial, sans-serif;
    background-color: black;

    background-image:
        repeating-radial-gradient(circle at 0% 0%,
            rgba(255,255,255,0.25) 0px,
            rgba(255,255,255,0.25) 2px,
            transparent 2px,
            transparent 60px
        ),
        repeating-conic-gradient(from 0deg at 0% 0%,
            rgba(255,255,255,0.2) 0deg,
            rgba(255,255,255,0.2) 3deg,
            transparent 3deg,
            transparent 30deg
        );

    background-size: 100% 100%;
}



/* ===== NAVBAR ===== */
.navbar {
    height: 75px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 30px;
    padding: 0 30px;
    background-color: #00000018;
}

.nav-icon {
    height: 42px;
    width: 42px;
    cursor: pointer;
    transition: transform 0.2s ease;
}

.nav-icon:hover {
    transform: scale(1.1);
}

/* ===== GAME AREA ===== */
#gameWrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ===== GAME CARD ===== */
#gameContainer {
    width: 800px;           /* 🔥 LESS WIDTH */
    max-width: 90%;
    height: 75vh;
    background: rgba(20,20,30,0.95);
    border: 3px solid white;
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 0 25px rgba(255,255,255,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* SCORE */
#score {
    font-size: 24px;
    color: white;
    margin-bottom: 8px;
}

/* CANVAS */
canvas {
    flex: 1;
    width: 100%;
    border-radius: 8px;
}

/* GAME OVER */
.game-over {
    position: absolute;
    background: rgba(20,20,30,0.95);
    color: white;
    padding: 25px;
    border-radius: 12px;
    display: none;
    text-align: center;
    border: 2px solid white;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <img src="{{ url_for('static', filename='images/witch.png') }}" class="nav-icon">
    <img src="{{ url_for('static', filename='images/about-us.png') }}" class="nav-icon">
    <img src="{{ url_for('static', filename='images/blackhole.png') }}" class="nav-icon">
    <img src="{{ url_for('static', filename='images/coffee-cup.png') }}" class="nav-icon">
</nav>

<div id="gameWrapper">
    <div id="gameContainer">
        <div id="score">Score: 0</div>
        <canvas id="gameCanvas"></canvas>

        <div class="game-over" id="gameOver">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Press SPACE or Tap to restart</p>
        </div>
    </div>
</div>

<script>

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const gameOverElement = document.getElementById('gameOver');
const finalScoreElement = document.getElementById('finalScore');

function resizeCanvas(){
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* ===== GAME STATE ===== */
let gameState = "playing";
let score = 0;
let frames = 0;

/* ===== GHOST ===== */
const ghost = {
    x: 100,
    y: 200,
    width: 35,
    height: 40,
    velocity: 0,
    gravity: 0.5,
    jumpPower: -8,

    update(){
        if(gameState !== "playing") return;

        this.velocity += this.gravity;
        this.y += this.velocity;

        if(this.y < 0){
            this.y = 0;
            this.velocity = 0;
        }

        if(this.y + this.height > canvas.height){
            triggerGameOver();
        }
    },

    jump(){
        if(gameState === "playing"){
            this.velocity = this.jumpPower;
        }
    },

    draw(){
    const x = this.x;
    const y = this.y;

    ctx.save();

    // Glow
    ctx.shadowColor = "rgba(255,255,255,0.8)";
    ctx.shadowBlur = 15;

    // Skull head
    ctx.fillStyle = "#f2f2f2";
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.fill();

    // Jaw
    ctx.beginPath();
    ctx.rect(x - 10, y + 5, 20, 12);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Eyes (black hollow)
    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(x - 6, y - 5, 4, 0, Math.PI * 2);
    ctx.arc(x + 6, y - 5, 4, 0, Math.PI * 2);
    ctx.fill();

    // Nose
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - 3, y + 6);
    ctx.lineTo(x + 3, y + 6);
    ctx.closePath();
    ctx.fill();

    // Teeth lines
    ctx.strokeStyle = "black";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - 6, y + 8);
    ctx.lineTo(x - 6, y + 17);
    ctx.moveTo(x, y + 8);
    ctx.lineTo(x, y + 17);
    ctx.moveTo(x + 6, y + 8);
    ctx.lineTo(x + 6, y + 17);
    ctx.stroke();

    ctx.restore();
}

};

/* ===== TOMBSTONES ===== */
const pipes = [];
const pipeWidth = 70;
const gap = 170;
const speed = 2;

function createPipe(){
    const topHeight = Math.random() * (canvas.height - gap - 100) + 50;
    pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        passed:false
    });
}

function updatePipes(){
    if(frames % 120 === 0){
        createPipe();
    }

    pipes.forEach(pipe => {
        pipe.x -= speed;

        if(!pipe.passed && pipe.x + pipeWidth < ghost.x){
            pipe.passed = true;
            score++;
            scoreElement.textContent = "Score: " + score;
        }

        if(
            ghost.x + 15 > pipe.x &&
            ghost.x - 15 < pipe.x + pipeWidth &&
            (ghost.y - 15 < pipe.top || ghost.y + 15 > pipe.bottom)
        ){
            triggerGameOver();
        }
    });
}

/* ===== DRAW ===== */
function drawBackground(){
    ctx.fillStyle = "black";
    ctx.fillRect(0,0,canvas.width,canvas.height);
}


function drawPipes(){
    pipes.forEach(pipe => {

        ctx.fillStyle = "#2d2d2d";

        // Top pillar
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);

        // Bottom pillar
        ctx.fillRect(pipe.x, pipe.bottom, pipeWidth, canvas.height - pipe.bottom);

        // ONE RIP on top
        ctx.fillStyle = "#ff6b35";
        ctx.font = "20px serif";
        ctx.textAlign = "center";

        ctx.fillText("RIP", pipe.x + pipeWidth/2, pipe.top - 20);

        // ONE RIP on bottom
        ctx.fillText("RIP", pipe.x + pipeWidth/2, pipe.bottom + 30);

        // Border
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 2;
        ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top);
        ctx.strokeRect(pipe.x, pipe.bottom, pipeWidth, canvas.height - pipe.bottom);
    });
}


/* ===== GAME LOOP ===== */
function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    
    drawBackground();

    if(gameState === "playing"){
        frames++;
        ghost.update();
        updatePipes();
    }

    drawPipes();
    ghost.draw();

    requestAnimationFrame(loop);
}

/* ===== GAME OVER ===== */
function triggerGameOver(){
    gameState = "gameOver";
    finalScoreElement.textContent = score;
    gameOverElement.style.display = "block";
}

/* ===== RESET ===== */
function resetGame(){
    gameState = "playing";
    score = 0;
    frames = 0;
    pipes.length = 0;
    ghost.y = canvas.height / 2;
    ghost.velocity = 0;
    scoreElement.textContent = "Score: 0";
    gameOverElement.style.display = "none";
}

/* ===== CONTROLS ===== */
document.addEventListener("keydown", e => {
    if(e.code === "Space"){
        if(gameState === "playing"){
            ghost.jump();
        } else {
            resetGame();
        }
    }
});

/* Mobile Tap */
canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    if(gameState === "playing"){
        ghost.jump();
    } else {
        resetGame();
    }
});

/* Mouse Click */
canvas.addEventListener("click", () => {
    if(gameState === "playing"){
        ghost.jump();
    } else {
        resetGame();
    }
});

loop();

</script>

</body>
</html>
