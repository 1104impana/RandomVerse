<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        
        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
            text-align: center;
        }
        
       .game-board {
    width: 90vmin;
    height: 90vmin;
    max-width: 400px;
    max-height: 400px;
    border: 3px solid #fff;
    background-color: #111;
}

        
        .score {
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 15px;
        }
        
        .controls {
            text-align: center;
            margin-top: 15px;
            font-size: 1.1em;
        }
        
        .game-over {
            text-align: center;
            margin-top: 20px;
            font-size: 1.3em;
            display: none;
        }
        
        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button:hover {
            background: #ccc;
        }
    </style>
</head>
<body>
    <h1>SNAKE GAME</h1>
    <div class="score">Score: <span id="score">0</span></div>
    <canvas class="game-board" id="game"></canvas>

    <div class="controls">
        <p>Use ARROW KEYS to move</p>
        <p>Press SPACE to start/restart</p>
    </div>
    <div class="game-over" id="gameOver">
        <p>Game Over!</p>
        <p>Final Score: <span id="finalScore">0</span></p>
    </div>
    <a href="{{ url_for('next_verse', current=current_file, r=random()) }}"
   class="hero-btn"
   style="position: fixed; bottom: 20px; right: 20px; z-index: 10000;">
  Next Verse
</a>

<!-- Transition Overlay -->
<div id="transition-overlay">
  <div id="typewriter-text"></div>
</div>

</body>
</html>
