<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Paint</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ripple.css') }}" />
</head>
<body>
  
  <nav class="navbar">
  <div class="nav-left">
    
  </div>
 
  <div class="nav-right">
    

    <div class="nav-item">
      <a href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='images/witch.png') }}" alt="Home" class="nav-icon" />
      </a>
      <span class="tooltip-text">Home</span>
    </div>

    <div class="nav-item">
  <a href="#about-section">
    <img src="{{ url_for('static', filename='images/about-us.png') }}" alt="About Us" class="nav-icon" />
  </a>
  <span class="tooltip-text">About Us</span>
</div>
    
   <!-- 🟢 Explore -->
    <div class="nav-item">
      <a href="#portal-container">
        <img src="{{ url_for('static', filename='images/blackhole.png') }}" alt="Explore" class="nav-icon" />
      </a>
      <span class="tooltip-text">Explore</span>
    </div>
    <div class="nav-item">
      <a href="{{ url_for('meditation') }}">
        <img src="{{ url_for('static', filename='images/coffee-cup.png') }}" alt="Meditation" class="nav-icon" />
      </a>
      <span class="tooltip-text">Support us</span>
    </div>
    
  </div>
</nav>


  <div class="bg-image"></div> 
  <canvas id="paintCanvas"></canvas>
  <div class="controls-wrapper">
    <div class="color-palette">
      <div class="color" style="background-color: rgba(255, 0, 0, 0.3);" data-color="rgba(255, 0, 0, 0.3)"></div>
      <div class="color" style="background-color: rgba(0, 0, 255, 0.3);" data-color="rgba(0, 0, 255, 0.3)"></div>
      <div class="color" style="background-color: rgba(0, 255, 0, 0.3);" data-color="rgba(0, 255, 0, 0.3)"></div>
      <div class="color" style="background-color: rgba(255, 255, 0, 0.3);" data-color="rgba(255, 255, 0, 0.3)"></div>
      <div class="color" style="background-color: rgba(255, 255, 255, 0.3);" data-color="rgba(255, 255, 255, 0.3)"></div>
      <div class="eraser" title="Eraser"></div>
    </div>
    <div class="reset" title="Reset"></div>
    <button id="downloadBtn">Download</button>
  </div>

  <audio id="bgAudio" src="{{ url_for('static', filename='sounds/space.mp3') }}" autoplay loop></audio>

  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>
  <script src="{{ url_for('static', filename='js/ripple.js') }}"></script>

  <a href="{{ url_for('next_verse', current=current_file, r=random()) }}"
   class="hero-btn"
   style="position: fixed; bottom: 20px; right: 20px; z-index: 10000;">
  Next Verse
</a>

 <!-- Transition Overlay -->
<div id="transition-overlay">
  <div id="typewriter-text"></div>
</div>

</body>
</html>
