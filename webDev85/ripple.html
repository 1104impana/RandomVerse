<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Space Paint</title>

  <link rel="stylesheet" href="css/ripple.css" />
  </head>
  <body>

    <div class ="bg-image"></div>

    <canvas id="paintCanvas"></canvas>
  <div class="controls-wrapper">
    <div class="color-palette">
    <div class="color" style="background-color: rgba(255, 0, 0, 0.3);" data-color="rgba(255, 0, 0, 0.3)"></div>
    <div class="color" style="background-color: rgba(0, 0, 255, 0.3);" data-color="rgba(0, 0, 255, 0.3)"></div>
    <div class="color" style="background-color: rgba(0, 255, 0, 0.3);" data-color="rgba(0, 255, 0, 0.3)"></div>
    <div class="color" style="background-color: rgba(255, 255, 0, 0.3);" data-color="rgba(255, 255, 0, 0.3)"></div>
    <div class="color" style="background-color: rgba(255, 255, 255, 0.3);" data-color="rgba(255, 255, 255, 0.3)"></div>
   </div>
   
   <button id="resetBtn" >Reset</button>
 </button>
</div>


    <!-- jQuery -->
   <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
   <!-- jQuery Ripples JS -->
   <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>
   
   <script src="js/ripple.js"></script>
   <!--reset button-->
   <script>
  document.getElementById("resetBtn").addEventListener("click", () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });
</script>
   
 

</body>
</html>
